name: tests

on:
  push:
    branches:
      - dev
      - homolog
      - main
      - release/residencial-v1
  pull_request:
    branches:
      - dev
      - homolog
      - main
      - release/residencial-v1

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile project modules
        run: |
          python -m py_compile app.py
          python -m compileall -q core ui tests

      - name: List discovered test files
        run: |
          find tests -name "test_*.py" | sort

      - name: Run consolidated tests
        run: |
          pytest -vv tests
