name: tests

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Smoke compile critical files
        run: |
          python -m py_compile app.py ui/client_area.py ui/coupons_admin.py core/coupons.py ui/payments_panel.py core/payments.py

      - name: Run tests
        run: |
          pytest -q tests/test_payments_full_contract.py tests/test_coupon_checkout_contract.py
