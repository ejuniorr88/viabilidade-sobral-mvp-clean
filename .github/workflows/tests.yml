name: tests

on:
  push:
    branches:
      - dev
      - homolog
      - main
      - release/residencial-v1
  pull_request:
    branches:
      - dev
      - homolog
      - main
      - release/residencial-v1

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile project modules
        run: |
          python -m py_compile app.py
          python -m compileall -q core ui

      - name: Compile non-report tests
        run: |
          find tests -name "test_*.py" \
            ! -path "tests/report/*" \
            ! -path "tests/report_pdf/*" \
            ! -path "tests/relatorio_multifamiliar/*" \
            ! -path "tests/relatorio_unifamiliar/*" \
            -print0 | xargs -0 -r python -m py_compile

      - name: List non-report test files
        run: |
          find tests -name "test_*.py" \
            ! -path "tests/report/*" \
            ! -path "tests/report_pdf/*" \
            ! -path "tests/relatorio_multifamiliar/*" \
            ! -path "tests/relatorio_unifamiliar/*" \
            | sort

      - name: Run non-report tests
        run: |
          pytest -vv tests \
            --ignore=tests/report \
            --ignore=tests/report_pdf \
            --ignore=tests/relatorio_multifamiliar \
            --ignore=tests/relatorio_unifamiliar
