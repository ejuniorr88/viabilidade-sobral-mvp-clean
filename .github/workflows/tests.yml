name: tests

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile critical modules
        run: |
          python -m py_compile             app.py             core/coupons.py             core/payments.py             ui/client_area.py             ui/coupons_admin.py             ui/payments_panel.py             ui/relatorio.py             ui/relatorio_blocks/multifamiliar_guia.py             ui/relatorio_blocks/figuras_anexo_v.py

      - name: Run contract and smoke tests
        run: |
          pytest -q             tests/test_payments_full_contract.py             tests/test_coupon_checkout_contract.py             tests/test_coupon_admin_contract.py             tests/test_app_relatorio_contract.py             tests/test_report_contract.py             tests/test_relatorio_phase1_contract.py             tests/test_relatorio_smoke.py             tests/test_unifamiliar_full_contract.py             tests/test_multifamiliar_full_contract.py             tests/test_unifamiliar_render_order_contract.py             tests/test_multifamiliar_render_order_contract.py             tests/test_lot_type_contract.py             tests/test_github_workflow_contract.py             tests/test_relatorio_area_pretendida_contract.py
