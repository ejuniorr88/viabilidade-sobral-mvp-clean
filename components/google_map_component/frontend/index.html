<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Map Component</title>
    <script src="https://unpkg.com/streamlit-component-lib/dist/index.js"></script>
    <style>
      html, body { margin: 0; padding: 0; font-family: sans-serif; background: transparent; }
      #map { width: 100%; min-height: 420px; border-radius: 10px; overflow: hidden; }
      #status { padding: 12px; color: #374151; font-size: 14px; }
      .error { color: #991b1b; background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; margin: 8px 0; }
    </style>
  </head>
  <body>
    <div id="status">Carregando mapa...</div>
    <div id="map"></div>
    <script src="main.js"></script>
  </body>
</html>
