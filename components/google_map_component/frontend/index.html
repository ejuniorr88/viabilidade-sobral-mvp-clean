<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Map Component</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #ffffff;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #status {
        display: none;
        margin: 0 0 8px 0;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.4;
      }
      #status.info {
        color: #0b5394;
        background: #eef5ff;
        border: 1px solid #cfe2ff;
      }
      #status.error {
        color: #b00020;
        background: #fdecec;
        border: 1px solid #f5c2c7;
      }
      #map {
        width: 100%;
        min-height: 420px;
        height: 420px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="status" class="info"></div>
      <div id="map"></div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
