<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Auth Popup Button</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: auto;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        width: 100%;
        box-sizing: border-box;
      }

      .auth-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #d9d9d9;
        background: #ffffff;
        color: #222222;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        box-sizing: border-box;
        font-size: 15px;
        font-weight: 700;
        text-align: center;
        cursor: pointer;
      }

      .auth-btn.subtle {
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
      }

      .auth-btn:focus-visible {
        outline: 2px solid rgba(37, 99, 235, 0.32);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
